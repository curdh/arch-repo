name: Actualizar PKGBUILDs

on:
  schedule:
    - cron: '0 2 * * *' # Se ejecuta diariamente a las 02:00 UTC
  workflow_dispatch:     # Permite ejecución manual desde la web de GitHub

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Actualizar e instalar dependencias básicas en Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git pacman-contrib jq curl namcap

          # 1. Crear el usuario 'builder' sin contraseña si no existe
          id -u builder &>/dev/null || useradd -m builder
          # Dar permisos al usuario builder sobre la carpeta del proyecto
          chown -R builder:builder .

      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Actualizar PKGBUILDs
        run: |
          # Recorrer las subcarpetas dentro de /src/
          for PKG_DIR in ./src/*/; do
            if [ -f "${PKG_DIR}PKGBUILD" ]; then
              PKG_NAME=$(basename "$PKG_DIR")
              echo "Procesando $PKG_NAME..."

              # Obtener repositorio de GitHub desde el PKGBUILD
              GH_REPO=$(grep -oP 'github\.com/\K[^/\s)]+/[^/\s).]+' "${PKG_DIR}PKGBUILD" | head -n 1 | sed 's/\.git$//')
              [ -z "$GH_REPO" ] && continue

              # Consultar la última release en la API
              RELEASE_JSON=$(curl -s "https://api.github.com/repos/$GH_REPO/releases/latest")

              LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r .tag_name)
              [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ] && continue

              CLEAN_VER=$(echo "$LATEST_TAG" | grep -oP '\d+(\.\d+)+' | head -n 1)
              CURRENT_VER=$(grep -E "^pkgver=" "${PKG_DIR}PKGBUILD" | cut -d'=' -f2 | tr -d "'\"")

              if [ -n "$CLEAN_VER" ] && [ "$CLEAN_VER" != "$CURRENT_VER" ]; then
                echo "Actualizando $PKG_NAME: $CURRENT_VER -> $CLEAN_VER"

                # Actualizar pkgver
                sed -i "s/^pkgver=.*/pkgver=$CLEAN_VER/" "${PKG_DIR}PKGBUILD"
                sed -i "s/^pkgrel=.*/pkgrel=1/" "${PKG_DIR}PKGBUILD"

                # Si el PKGBUILD requiere _codename, lo extraemos directamente del nombre de la release
                if grep -q "^_codename=" "${PKG_DIR}PKGBUILD"; then
                  RELEASE_TITLE=$(echo "$RELEASE_JSON" | jq -r .name)

                  # Convierte "9.2.3 (Ackbar Delta)" -> "Ackbar-Delta"
                  NEW_CODENAME=$(echo "$RELEASE_TITLE" | sed -E 's/^[0-9.]+//; s/[()"]//g; s/^\s+|\s+$//g; s/ +/-/g')

                  if [ -n "$NEW_CODENAME" ] && [ "$NEW_CODENAME" != "null" ]; then
                    echo "Nuevo codename asignado: $NEW_CODENAME"
                    sed -i "s/^_codename=.*/_codename=\"$NEW_CODENAME\"/" "${PKG_DIR}PKGBUILD"
                  fi
                fi

                # Asignar permisos al usuario builder para este directorio
                chown -R builder:builder "$PKG_DIR"

                # 2. EJECUTAR updpkgsums COMO USUARIO 'builder' (NO ROOT)
                su builder -c "cd '$PKG_DIR' && updpkgsums"
                (namcap -i "${PKG_DIR}PKGBUILD")
              fi
            fi
          done

      - name: Guardar cambios
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add src/
            git commit -m "chore: actualizar PKGBUILDs a la última versión"
            git push
          else
            echo "No hay actualizaciones."
          fi
