name: Actualizar PKGBUILDs

on:
  schedule:
    - cron: '0 2 * * *' # Se ejecuta diariamente a las 02:00 UTC
  workflow_dispatch:     # Permite ejecución manual desde la web de GitHub

env:
  # Lista de paquetes a construir. 'ALL' para construir todos
  PKGS_TO_BUILD: "lgogdownloader"

jobs:
  update-pkgbuilds:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Actualizar e instalar dependencias básicas en Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git pacman-contrib jq curl namcap
          
          # Crear el usuario 'builder' sin contraseña si no existe y dar permisos sudo sin contraseña
          if ! id -u builder &>/dev/null; then
            useradd -m builder
            # Otorga permisos de sudo sin contraseña al usuario builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          fi
          
          # Dar permisos al usuario builder sobre la carpeta del proyecto
          chown -R builder:builder .

          # Cambiar 'debug' por '!debug' en /etc/makepkg.conf
          sed -i 's/\bdebug\b/!debug/g' /etc/makepkg.conf
          
      - name: Checkout del repositorio
        uses: actions/checkout@v4.2.2

      - name: Actualizar y construir PKGBUILDs
        run: |
          # Determinar qué paquetes construir (prioridad: ejecución manual > variable de entorno)
          SELECTED_PKGS="${{ github.event.inputs.packages_to_build }}"
          [ -z "$SELECTED_PKGS" ] && SELECTED_PKGS="$PKGS_TO_BUILD"

          # Directorio temporal para recolectar todos los .pkg.tar.zst generados y carpeta temporal para compilar
          if [ -n "$SELECTED_PKGS" ];
          then
            REPO_DIR="${GITHUB_WORKSPACE}/build_output"
            mkdir -p "$REPO_DIR"
            BUILD_TEMP="/tmp/${PKG_NAME}"
          fi
                
          # Recorrer las subcarpetas dentro de /src/
          for PKG_DIR in ./src/*/; do
            if [ -f "${PKG_DIR}PKGBUILD" ]; then
              PKG_NAME=$(basename "$PKG_DIR")
              echo "Procesando $PKG_NAME..."
              
              # Obtener repositorio de GitHub desde el PKGBUILD
              GH_REPO=$(grep -oP 'github\.com/\K[^/\s)]+/[^/\s).]+' "${PKG_DIR}PKGBUILD" | head -n 1 | sed 's/\.git$//' | tr -d '"'\''')
              [ -z "$GH_REPO" ] && continue
              
              # Consultar la última release en la API
              RELEASE_JSON=$(curl -s "https://api.github.com/repos/$GH_REPO/releases/latest")
              LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r .tag_name)
              [ "$LATEST_TAG" == "null" ] || [ -z "$LATEST_TAG" ] && continue
              CLEAN_VER=$(echo "$LATEST_TAG" | grep -oP '\d+(\.\d+)+' | head -n 1)
              CURRENT_VER=$(grep -E "^pkgver=" "${PKG_DIR}PKGBUILD" | cut -d'=' -f2 | tr -d "'\"")

              # Si hay una actualización disponible
              if [ -n "$CLEAN_VER" ] && [ "$CLEAN_VER" != "$CURRENT_VER" ]; then
                echo "Actualizando $PKG_NAME: $CURRENT_VER -> $CLEAN_VER"
                # Actualizar pkgver
                sed -i "s/^pkgver=.*/pkgver=$CLEAN_VER/" "${PKG_DIR}PKGBUILD"
                sed -i "s/^pkgrel=.*/pkgrel=1/" "${PKG_DIR}PKGBUILD"
                
                # Si el PKGBUILD requiere _codename, lo extraemos directamente del nombre de la release
                if grep -q "^_codename=" "${PKG_DIR}PKGBUILD"; then
                  RELEASE_TITLE=$(echo "$RELEASE_JSON" | jq -r .name)
                  
                  # Convierte "9.2.3 (Ackbar Delta)" -> "Ackbar-Delta"
                  NEW_CODENAME=$(echo "$RELEASE_TITLE" | sed -E 's/^[0-9.]+//; s/[()"]//g; s/^\s+|\s+$//g; s/ +/-/g')
                  
                  if [ -n "$NEW_CODENAME" ] && [ "$NEW_CODENAME" != "null" ]; then
                    echo "Nuevo codename asignado: $NEW_CODENAME"
                    sed -i "s/^_codename=.*/_codename=\"$NEW_CODENAME\"/" "${PKG_DIR}PKGBUILD"
                  fi
                fi
                
                # Asignar permisos al usuario builder para este directorio
                chown -R builder:builder "$PKG_DIR"
                
                # Probar url para ver si existe el release.
                SOURCE_URL=$(su builder -c "cd '$PKG_DIR' && makepkg --printsrcinfo | grep -E '^\s*source = ' | head -n 1 | awk -F:: '{print $2}'")
                if ! curl -fsLI "$SOURCE_URL" -o /dev/null; 
                then
                  echo "Release not found. Skipping package."
                  git checkout -- "${PKG_DIR}PKGBUILD" 2>/dev/null || true
                  continue
                fi
                
                # Actualizar sha256sums y verificar con namcap.
                su builder -c "cd '$PKG_DIR' && updpkgsums"
                (namcap -i "${PKG_DIR}PKGBUILD")

                if [ -n "$SELECTED_PKGS" ];
                then
                  # Chequea si el PKGBUILD debe ser construido.
                  if [ "$SELECTED_PKGS" != "ALL" ] && ! echo " $SELECTED_PKGS " | grep -q " $PKG_NAME "; 
                  then
                    continue
                  fi
                fi

                # Crear una carpeta temporal aislada fuera del repositorio de Git
                rm -rf "$BUILD_TEMP"
                mkdir -p "$BUILD_TEMP"

                # Copiar todos los archivos de la receta (PKGBUILD, parches, .install, etc.)
                cp -r "${PKG_DIR}/"* "$BUILD_TEMP"/

                # Inyectar '-bin', 'provides' y 'conflicts' SOLO en el PKGBUILD temporal
                sed -i -E 's/^pkgname=(["'\''"]?)([^"'\''\n]+)\1/pkgname=\1\2-bin\1/' "${BUILD_TEMP}/PKGBUILD"

                if ! grep -q "^provides=" "${BUILD_TEMP}/PKGBUILD"; then
                  echo "provides=('$PKG_NAME')" >> "${BUILD_TEMP}/PKGBUILD"
                fi
                if ! grep -q "^conflicts=" "${BUILD_TEMP}/PKGBUILD"; then
                  echo "conflicts=('$PKG_NAME')" >> "${BUILD_TEMP}/PKGBUILD"
                fi

                # Asignar propiedad al usuario builder en la carpeta temporal
                chown -R builder:builder "$BUILD_TEMP"

                # Construir paquete.
                echo "- Construyendo paquete $PKG_NAME..."
                if su builder -c "cd '$BUILD_TEMP' && OPTIONS='!debug' makepkg -sc --noconfirm"; 
                then
                  echo "$PKG_NAME compilado con éxito."
                  # Mover el binario generado a la carpeta de salida
                  mv "$BUILD_TEMP"/*.pkg.tar.zst "$REPO_DIR"/ 2>/dev/null || true
                else
                  echo "Error al compilar $PKG_NAME."
                fi

                # Limpieza de archivos temporales de compilación
                rm -rf "$BUILD_TEMP"
              fi
            fi
          done

          if [ -n "$SELECTED_PKGS" ];
          then
            # Generar la base de datos de Pacman con repo-add
            cd "$REPO_DIR"
            if ls *.pkg.tar.zst 1> /dev/null 2>&1; 
            then
              echo "Generando base de datos del repositorio..."
              # Garantizar que /tmp exista y tenga permisos de lectura/escritura/ejecución
              mkdir -p /tmp
              chmod 1777 /tmp
              
              repo-add -n -R curdh.db.tar.gz *.pkg.tar.zst
            else
              echo "No se generaron archivos .pkg.tar.zst para empaquetar."
            fi
          fi
          
      - name: Guardar cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory /__w/arch-repo/arch-repo
          
          # Registra SOLAMENTE los archivos PKGBUILD en cualquier subcarpeta dentro de src/
          git add src/*/PKGBUILD
          
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "chore: actualizar PKGBUILDs a la última versión"
            git push
          else
            echo "No hay actualizaciones en los PKGBUILDs."
          fi

      - name: Publicar Repositorio en GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "latest"
          name: "Arch Linux Custom Repository"
          body: "Repositorio binario de Pacman actualizado automáticamente."
          files: |
            build_output/*.pkg.tar.zst
            build_output/curdh.db*
            build_output/curdh.files*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
